
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Última Porta</title>
    <link rel="stylesheet" href="Styles/a-ultima-porta.css">
</head>
<body>

    <main class="cena" id="cena">

        <div class="ambiente">

            <div class="parede"></div>

            <div class="batente">
                <div class="porta" id="porta">

                    <div class="painel painel-superior"></div>
                    <div class="painel painel-inferior"></div>

                    <div class="macaneta">
                        <div class="base-macaneta"></div>
                        <div class="haste-macaneta"></div>
                    </div>

                </div>
            </div>

            <div class="luz-interior" id="luzInterior"></div>

        </div>

        <div class="vinheta"></div>

        <div class="dialogo" id="dialogo">
            <p id="texto"></p>
        </div>

        <div class="tela-preta" id="telaPreta"></div>

        <div class="final" id="final">
            <h1>Nossa casa.</h1>
        </div>

    </main>

    <script src="Scripts/a-ultima-porta.js"></script>
</body>
</html>
