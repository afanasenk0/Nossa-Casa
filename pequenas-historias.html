<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pequenas Histórias</title>

    <link rel="stylesheet" href="Styles/pequenas-historias.css">
</head>

<body>

    <main id="pagina">

        <section id="introducao">

            <p id="frase"></p>

        </section>


        <section id="historias">

            <button id="anterior" class="navegacao">
                ‹
            </button>


            <div id="carrossel">

                <article id="historia">

                    <span id="numero-historia"></span>

                    <h1 id="titulo-historia"></h1>

                    <div class="separador"></div>

                    <p id="texto-historia"></p>

                </article>

            </div>


            <button id="proximo" class="navegacao">
                ›
            </button>

        </section>


        <div id="contador"></div>

        <div id="indicadores"></div>


        <section id="final">

            <p id="frase-final"></p>

        </section>

    </main>


    <script src="Scripts/pequenas-historias.js"></script>

</body>

</html>
