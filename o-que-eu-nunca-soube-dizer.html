<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O Que Eu Nunca Soube Dizer</title>

    <link rel="stylesheet" href="Styles/o-que-eu-nunca-soube-dizer.css">
</head>

<body>

    <main id="pagina">

        <!-- INTRODUÇÃO -->

        <section id="introducao">

            <p id="frase"></p>

        </section>


        <!-- PENSAMENTOS -->

        <section id="pensamentos">

            <button class="pensamento" data-pensamento="1">
                <span class="numero">01</span>
            </button>

            <button class="pensamento" data-pensamento="2">
                <span class="numero">02</span>
            </button>

            <button class="pensamento" data-pensamento="3">
                <span class="numero">03</span>
            </button>

            <button class="pensamento" data-pensamento="4">
                <span class="numero">04</span>
            </button>

            <button class="pensamento" data-pensamento="5">
                <span class="numero">05</span>
            </button>

        </section>


        <!-- PENSAMENTO ABERTO -->

        <section id="pensamento-aberto">

            <button id="fechar">×</button>

            <p id="pensamento-numero"></p>

            <h2 id="pensamento-titulo"></h2>

            <p id="pensamento-texto"></p>

        </section>


        <!-- FINAL -->

        <section id="final">

            <p id="frase-final"></p>

        </section>

    </main>


    <script src="Scripts/o-que-eu-nunca-soube-dizer.js"></script>

</body>

</html>
